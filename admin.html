<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Admin - $secretshiba</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #1a472a 0%, #0d2817 100%);
      min-height: 100vh;
      color: #fff;
      padding: 30px 16px;
    }
    .wrap { max-width: 1000px; margin: 0 auto; }
    h1 { color: #ffd700; margin-bottom: 6px; }
    .sub { color: #aaa; margin-bottom: 24px; }
    .card {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 215, 0, 0.3);
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 20px;
    }
    .row { display: flex; gap: 10px; flex-wrap: wrap; }
    input {
      flex: 1;
      min-width: 200px;
      padding: 12px;
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid rgba(255, 215, 0, 0.3);
      border-radius: 4px;
      color: #fff;
      font-size: 1em;
    }
    button {
      background: linear-gradient(135deg, #ff6b6b 0%, #dc3545 100%);
      color: #fff;
      border: none;
      border-radius: 4px;
      padding: 10px 18px;
      font-weight: bold;
      cursor: pointer;
    }
    button.secondary { background: transparent; border: 1px solid #ffd700; color: #ffd700; }
    button:disabled { opacity: 0.5; cursor: default; }
    #message { margin-top: 12px; min-height: 1.2em; }
    .error { color: #ff6b6b; }
    .ok { color: #4ade80; }
    .search { margin-bottom: 14px; }
    table { width: 100%; border-collapse: collapse; }
    th, td { text-align: left; padding: 10px 8px; border-bottom: 1px solid rgba(255, 215, 0, 0.15); font-size: 0.92em; }
    th { color: #ffd700; font-weight: 600; }
    td.wallet { font-family: monospace; color: #aaa; }
    tr.is-hidden td { opacity: 0.55; }
    .badge { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 0.8em; }
    .badge.visible { background: rgba(74, 222, 128, 0.15); color: #4ade80; }
    .badge.hidden { background: rgba(255, 107, 107, 0.15); color: #ff6b6b; }
    .badge.unverified { background: rgba(170, 170, 170, 0.15); color: #aaa; }
    .table-wrap { overflow-x: auto; }
    @media (max-width: 640px) { td.wallet, th.wallet { display: none; } }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>🎅 Admin</h1>
    <p class="sub">Hide rude or spammy members from the leaderboard, random picks and the gift feed.</p>

    <div class="card">
      <div class="row">
        <input type="password" id="password" placeholder="Admin password" autocomplete="current-password"
               onkeydown="if(event.key==='Enter') loadUsers()">
        <button id="loadBtn" onclick="loadUsers()">Load members</button>
      </div>
      <div id="message"></div>
    </div>

    <div class="card" id="usersCard" style="display: none;">
      <input class="search" id="search" placeholder="Search by name, wallet or X handle" oninput="render()">
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Name</th>
              <th>X</th>
              <th class="wallet">Wallet</th>
              <th>Gifted</th>
              <th>Status</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="usersBody"></tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    const API_URL = window.location.hostname === 'localhost' ? 'http://localhost:3000' : 'https://christmas-sol-gift.onrender.com';
    let users = [];

    function escapeHtml(value) {
      return String(value == null ? '' : value)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }

    function setMessage(text, type) {
      const el = document.getElementById('message');
      el.textContent = text;
      el.className = type || '';
    }

    async function adminPost(path, body) {
      const res = await fetch(`${API_URL}${path}`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(Object.assign({ password: document.getElementById('password').value }, body || {}))
      });
      let data = {};
      try { data = await res.json(); } catch (e) {}
      return { res, data };
    }

    async function loadUsers() {
      const btn = document.getElementById('loadBtn');
      btn.disabled = true;
      setMessage('Loading... (the server may take up to a minute to wake up)');
      try {
        const { res, data } = await adminPost('/api/admin/users');
        if (!res.ok) {
          setMessage(data.error || 'Could not load members', 'error');
          return;
        }
        users = data;
        document.getElementById('usersCard').style.display = 'block';
        setMessage(`${users.length} members loaded`, 'ok');
        render();
      } catch (e) {
        setMessage('Network error. Try again in a moment.', 'error');
      } finally {
        btn.disabled = false;
      }
    }

    function render() {
      const q = document.getElementById('search').value.trim().toLowerCase();
      const rows = users.filter((u) =>
        !q || [u.name, u.address, u.twitter].some((v) => (v || '').toLowerCase().includes(q))
      );
      document.getElementById('usersBody').innerHTML = rows.map((u) => {
        const status = !u.verified ? '<span class="badge unverified">unverified</span>'
          : u.hidden ? '<span class="badge hidden">hidden</span>'
          : '<span class="badge visible">visible</span>';
        const wallet = u.address ? `${u.address.slice(0, 4)}…${u.address.slice(-4)}` : '';
        return `
          <tr class="${u.hidden ? 'is-hidden' : ''}">
            <td>${escapeHtml(u.name)}</td>
            <td>${u.twitter ? '@' + escapeHtml(u.twitter) : ''}</td>
            <td class="wallet" title="${escapeHtml(u.address)}">${escapeHtml(wallet)}</td>
            <td>${Number(u.total_gifted || 0).toFixed(2)}</td>
            <td>${status}</td>
            <td>
              <button class="${u.hidden ? 'secondary' : ''}" onclick="setHidden(${Number(u.id)}, ${u.hidden ? 'false' : 'true'})">
                ${u.hidden ? 'Unhide' : 'Hide'}
              </button>
            </td>
          </tr>`;
      }).join('') || '<tr><td colspan="6" style="color:#aaa;">No members match.</td></tr>';
    }

    async function setHidden(id, hidden) {
      const user = users.find((u) => u.id === id);
      if (hidden && !confirm(`Hide "${user ? user.name : 'this member'}"? They will be removed from the leaderboard and logged out.`)) return;
      try {
        const { res, data } = await adminPost('/api/admin/hide', { id, hidden });
        if (!res.ok) {
          setMessage(data.error || 'Could not update member', 'error');
          return;
        }
        if (user) user.hidden = hidden ? 1 : 0;
        setMessage(hidden ? 'Member hidden' : 'Member visible again', 'ok');
        render();
      } catch (e) {
        setMessage('Network error. Try again.', 'error');
      }
    }
  </script>
</body>
</html>
